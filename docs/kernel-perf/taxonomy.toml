# ------------------------------------------------------------------------------------------------
# Components. generic = true: every shared-engine family has it (attention, projections, norms,
# ...). generic = false: only the families that list it. `sites` are path prefixes of Rust call
# sites whose launches belong to this component (a kernel launched from there is "used by" the
# component even when its primary component is another one, e.g. a GEMV launched by the GDN layer).
# ------------------------------------------------------------------------------------------------

[[component]]
id = "attention"
name = "Attention (GQA/MHA: paged decode, split-K, prefill/flash)"
generic = true
sites = ["crates/model-layers/src/layers/qwen3_attention/"]

[[component]]
id = "mla"
name = "MLA (multi-head latent attention)"
generic = false
sites = ["crates/model-arch/src/kimi_k3/mla_cuda.rs"]

[[component]]
id = "sparse-attn"
name = "Sparse / compressed attention (DSA, CSA/HCA, QSA)"
generic = false
sites = ["crates/model-arch/src/glm5next_dsa/", "crates/model-arch/src/attn_v41", "crates/model-layers/src/layers/qsa"]

[[component]]
id = "gdn"
name = "GDN (gated delta rule linear attention)"

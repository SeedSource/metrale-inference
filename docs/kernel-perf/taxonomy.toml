# SPDX-License-Identifier: MIT OR Apache-2.0
#
# Curated half of KERNEL-PERF.md: the architecture families, the architectural components, the
# rules that give each kernel entry point its primary component, and the Rust call-site paths
# that attribute a launch to a component or a family. The generator (scripts/kernel_perf.py)
# derives everything else from the tree and REFUSES to render while a kernel matches no rule, a
# rule matches no kernel, or a model directory belongs to no family, so this file cannot drift
# silently from kernels/ and crates/.
#
# Matching: `files` are fnmatch globs over the repo-relative path of the file that defines the
# entry point; `names` are fnmatch globs over the entry-point name. A rule matches when every
# list it has matches. Rules are tried in order; the first match wins, so specific rules come
# before broad ones.

# ------------------------------------------------------------------------------------------------
# Architecture families. `label` is the short name the tables use. `models` are kernels/<hw>/<model> directory names (the same name on every
# hardware tree). `components` are the architecture-specific components the family's layers have;
# generic components (generic = true below) apply to every family with shared_engine = true.
# shared_engine = false: the family's forward pass does not go through the shared transformer
# path, so it uses only kernels launched from its own call-site paths.
# ------------------------------------------------------------------------------------------------

[[family]]
id = "qwen-gdn-dense"
label = "Qwen-GDN"
name = "Qwen3.x GDN hybrid, dense FFN"
models = ["qwen3.5-27b", "qwen3.6-27b", "qwen3.8-27b", "holo-3.1-0.8b", "holo-3.1-4b", "ornith-1.0-9b", "qwen3-5-4b-vlm-mlx-int8"]

[build]
extra_nvcc_flags = ["--fmad=false", "-DTQ_PLUS_SIGNS"]

# 2026-09-25: Kernels a model shadow may drop without the shadow-drop build
# warning, keyed by module name (after `[modules]`) to entry points. This only
# silences the warning: every dropped pair still goes into
# `TargetPtxSet::shadowed_dropped` (crates/kernels/build.rs).
#
#   w4a16::w4a16_dequant: no crate looks it up.
#   moe_w4a16::moe_w4a16_grouped_gemm: no crate looks it up; the MoE layer
#       uses the `_ptrtable` kernels (model-layers moe/init.rs).
#   moe_w4a16 tile variants and moe_w4a16_grouped_stream_probe: looked up only
#       by the GLM routed-MoE prefill (model-arch glm5next_mlp, tile chosen by
#       METRALE_GLM_MOE_GEMM_TILE) and by model-arch example benchmarks.
#   norm::{rms_norm_residual_vanilla, residual_add_rms_norm_vanilla}: looked
#       up only when `ships_vanilla_norm_weights(config)` holds
#       (model-layers qwen3_attention/init.rs).
#   norm::gated_rms_norm_f32_input_strided: looked up with try_kernel
#       (model-layers qwen3_ssm/init.rs); handle 0 keeps the per-sequence loop.























































[shadow_exempt]
w4a16 = ["w4a16_dequant"]
moe_w4a16 = [
  "moe_w4a16_grouped_gemm",
  "moe_w4a16_grouped_gemm_ptrtable_al_k64",
  "moe_w4a16_grouped_gemm_ptrtable_alkm_k128",
  "moe_w4a16_grouped_gemm_ptrtable_alkm_k64",
  "moe_w4a16_grouped_gemm_ptrtable_alkm_m16_k128",
  "moe_w4a16_grouped_gemm_ptrtable_alkm_m16_k256",

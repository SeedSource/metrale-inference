#
# Known trade-offs per kernel, rendered into KERNEL-PERF.md by scripts/kernel_perf.py.
# match: a kernel source file (applies to every entry point it defines or compiles), or
#        `<file>::<entry point>`. The generator fails on a match that names nothing.
# text:  <= 400 characters: what was traded for what, a known limit, or a dated measurement.
# prs:   Metrale/metrale-inference pull requests only.
# source: where the statement comes from (file:line, a PR, a doc or a dated measurement note).

[[t]]
match = "kernels/b200/kimi-k3/bf16/dense_f32io.cu"
text = "Single kernel handles resident FP32 or BF16 weights via a per-element runtime dtype branch (k3_load_weight) rather than two specialized kernels, keeping activations FP32 throughout; one warp per output row with a shfl_down reduction, no K tiling."
prs = []
source = "kernels/b200/kimi-k3/bf16/dense_f32io.cu:3"

[[t]]
match = "kernels/b300/common/dsa_indexer.cu"
text = "Fork of the gb10 indexer (70 of 627 lines differ): dsa_index_scores sums each head with a block-wide reduction and a barrier per head (gb10: one warp per head), and dsa_expand_selection counts visible tail keys serially on thread 0 over S (gb10: split across threads)."
prs = []
source = "kernels/b300/common/dsa_indexer.cu:233; kernels/b300/common/dsa_indexer.cu:414"

[[t]]
match = "kernels/b300/common/moe_shared_expert_fused.cu"
text = "Diverges from the gb10 file: the hardcoded routed-expert activation clamp is removed, so routed and shared experts use plain silu(gate) * up; outputs differ from gb10's wherever the clamp would bind."
prs = []
source = "kernels/b300/README.md"

[[t]]
match = "kernels/b300/common/moe_shared_expert_fused.cu"
text = "The b300 fork applies no clamp in SiLU(gate)*up, so routed and shared experts get the same activation; the gb10 copy caps the routed gate at 10 and routed up at +-10. MoE outputs are therefore not comparable bit-for-bit across the two hardware classes."
prs = []
source = "kernels/b300/common/moe_shared_expert_fused.cu:267"

[[t]]
match = "kernels/b300/common/w8a16_gemv_batch4.cu"
text = "Each weight is dequantized once for up to 4 or 16 rows, and every row adds the same products in the same order as w8a16_gemv (two separate additions; acc += x + y would round differently), so each row equals the M = 1 output. M above MAX_M is refused by the host."
prs = []
source = "kernels/b300/common/w8a16_gemv_batch4.cu:22"

[[t]]
match = "kernels/gb10/common/argmax_bf16.cu"
text = "One block (1024 threads, 1024-entry shared arrays, halving tree) reduces a whole vocab row, so a single-row argmax occupies one SM; blockDim.x must be a power of two <= 1024. A tie goes to the lower thread, not the lower vocab index: each thread keeps the first strict max of its strided subset."
prs = []
source = "kernels/gb10/common/argmax_bf16.cu:3"

[[t]]
match = "kernels/gb10/common/argmax_bf16.cu::argmax_bf16_batch_lp"
text = "Adds log p(argmax) via an online softmax in the same pass, using the fast __expf/__logf intrinsics, so the log-probability is approximate; it feeds the D-Cut verify-depth ranking only. Costs a third 1024-float shared array (12288 B smem, 19 regs on sm_121f vs 16 for argmax_bf16_batch, no spills)."
prs = []
source = "kernels/gb10/common/argmax_bf16.cu:113; kernels/b200/deepseek-v4-flash/PTXAS_RESOURCES.md:8"

[[t]]
match = "kernels/gb10/common/argmax_bf16.cu::argmax_fp32"

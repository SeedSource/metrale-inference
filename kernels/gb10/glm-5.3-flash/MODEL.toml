[model]
name = "glm-5.3-flash"
hf_id = "LibertAIDAI/GLM-5.3-Flash-NVFP4"
revision = "9e0d74e3cef17f634e84fb8e2223707e02616290"
model_type = "glm5_next"
architecture = "Hybrid KDA linear-attention + NoPE sparse MLA (DSA) + mHC + NVFP4 MoE"
parameters = "320B-A18B"

layers_total = 45
layers_kda = 34
layers_dsa = 11
layer_pattern = "3 KDA then 1 DSA, repeating; layer 45 is the MTP head (out of scope)"
first_k_dense_replace = 3

hidden_dim = 4096
vocab_size = 154624
max_position_embeddings = 262144


q_heads = 64
kv_heads = 64
q_lora_rank = 1536
kv_lora_rank = 512
qk_nope_head_dim = 256
qk_rope_head_dim = 0
v_head_dim = 256

# 2026-09-25: NoPE: the checkpoint config has qk_rope_head_dim 0 and no rope_theta
# (crates/model-engine/tests/fixtures/glm53-nvfp4-9e0d74e3-config.json), so a latent
# cache token is kv_lora_rank (512) wide.
rotary_dim = 0
partial_rotary_factor = 0.0


index_n_heads = 32
index_head_dim = 128
index_kpool = 4
index_topk = 2048
index_kpool_always_select_tail = true


linear_num_heads = 64
linear_head_dim = 128
linear_conv_kernel = 4


moe_experts = 288
moe_topk = 8
moe_intermediate = 2048
shared_expert_intermediate = 2048
moe_scoring_func = "sigmoid"
moe_routing_bias = true
n_group = 1
routed_scaling_factor = 2.5


hc_mult = 4
hc_sinkhorn_iters = 20

# 2026-10-14: Effort is a prompt line only, as on the official model. Its chat_template.jinja
# (nvidia/GLM-5.3-Flash-NVFP4 @09b04e5e, lines 2-3) renders "Reasoning Effort: Low|High|Max"
# (any other value, and none, is Max) and vLLM serves it with no thinking budget. So no
# effort level, and no request without one, gets a budget, a budget-forced </think> or the
# confidence early stop; an explicit client budget still applies. METRALE_EFFORT_THINKING_BUDGET=1
# or --max-thinking-budget brings the old ladder back (64/128/256/512/1024 at E = 256).
# 2026-10-15: That alone still let the thinking-loop watchdog force </think>; it is off too
# (enable_think_loop_watchdog below), so thinking ends when the model closes it or at max_tokens.
[behavior]
effort_prompt_only = true
# 2026-10-15: response_format wins over the tool-call grammar unless tool_choice is required or
# names a function, as vLLM applies it with tool_choice auto (TEB TC-65/66/67/69 send the schema
# after the tool result: official bare JSON 24/24, c30 prose-wrapped 12/12; spark-bench c30gate
# TEBGAP-TRACE.md). A turn under the JSON grammar cannot call a tool.
response_format_with_tools = true
# 2026-10-15: No thinking-loop watchdog (scheduler/think_commit.rs, on by default): the official
# serve has none, and on TEB TC-88 it forced </think> twice per trial on the model's own digit
# list, so turn 3 ran to max_tokens (spark-bench c30gate TEBGAP-TRACE.md B). The output
# repetition guards (content-loop and the rest) are separate and unchanged.
enable_think_loop_watchdog = false
# 2026-10-15: No <tool_call> start-token logit bias (+3 on the first calls): vLLM adds none
# (spark-bench c30gate TEBGAP-TRACE.md D, parity; effect ~0 there).
tool_call_start_bias = false
# 2026-10-15: No minimum-reasoning floor (</think> biased -8 for the first 16 thinking tokens,
# the ModelBehavior default): the official serve has none (TEBGAP-TRACE.md E, rarely binds).
min_reasoning_floor_tokens = 0
# 2026-10-15: Tool schemas render as the official template renders them: the spaced HF tojson
# ({"a": 1}; METRALE_USE_HF_REF_JSON_DUMPS=1 still selects it for any model), and the declared
# tools are rendered for tool_choice=none too (vLLM's default), with tools still inactive for
# parsing, the grammar and the bias. TEB turn-1 prompts: 86/88 differed from the official
# render with the compact form, 87/88 byte-identical with HfSpaced, TC-44 (tool_choice=none)
# the last (spark-bench c30gate TEBGAP-TRACE.md C).
hf_tool_json = true
render_tools_on_tool_choice_none = true

# 2026-09-25: The target matcher: ptx_for_config (crates/kernels/src/resolve.rs) matches a
# checkpoint to this target by [[model_types]], and serve refuses a model_type that no
# target declares (serve_load.rs). The dimension keys in [model] do not take part.
# `glm5_next` is what parse_glm5_next sets for this checkpoint, whose text_config says
# `glm5_next_text` (crates/config/src/parsers/glm5_next/parse.rs).



[[model_types]]
model_type = "glm5_next"
hidden_size = 4096

# 2026-09-25: Kernel lookups this model's dispatch may issue that this target does not
# ship. The boot kernel gate refuses any other unresolved lookup unless
# --dangerously-allow-unresolved-kernel-lookups is set (serve_phases/kernel_gate.rs).
# layers::tgemm_kernel tries w4a16_gemm_t_p3 and takes w4a16_gemm_t when it is absent.

[expected_absent.w4a16]
w4a16_gemm_t_p3 = "3-deep p3 twin shipped only in qwen3.6-27b's shadow; layers::tgemm_kernel falls back to w4a16_gemm_t (resolves). Unmeasured for this target."
# 2026-10-01: DFlash drafter (METRALE_GLM_DFLASH=1, e.g. canada-quant GLM-5.3-Flash-DFlash2-G):
# dflash_head/from_weights/kernel_handles.rs probes the row-scaled FP8 drafter GEMMs, which ship
# only in the qwen3.6 targets' w4a16 shadow. Absent here, the FP8 drafter path stays off
# (`fp8_kernels_present`) and the drafter runs BF16; nothing else changes.
fp8_gemm_t_row_scaled_k64 = "DFlash FP8 drafter GEMM (deep-K), qwen3.6 shadow only; absent => BF16 drafter (fp8_kernels_present false)."
fp8_gemm_t_row_scaled_p4 = "DFlash FP8 drafter GEMM (4-stage), qwen3.6 shadow only; absent => BF16 drafter (fp8_kernels_present false)."
fp8_gemm_t_row_scaled = "DFlash FP8 drafter GEMM, qwen3.6 shadow only; absent => BF16 drafter (fp8_kernels_present false)."
fp8_gemm_t_row_scaled_m16 = "DFlash FP8 drafter GEMM (M=16 twin), qwen3.6 shadow only; absent => BF16 drafter (fp8_kernels_present false)."

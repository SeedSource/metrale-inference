[build]
extra_nvcc_flags = ["--fmad=false", "-DTQ_PLUS_SIGNS"]

# 2026-09-25: Kernels a model shadow may drop without the build warning about
# it. Keyed by module name (after the [modules] mapping), each an array of
# entry points (build_parse.rs `parse_shadow_exempt`). It only silences the
# warning: build.rs still records every dropped kernel in
# `TargetPtxSet::shadowed_dropped`, which the startup kernel gate reads.
#
#   w4a16::w4a16_dequant: no crate looks it up.
#   moe_w4a16::moe_w4a16_grouped_gemm: no crate looks it up.
#   norm::{rms_norm_residual_vanilla, residual_add_rms_norm_vanilla}: looked
#       up only when `ships_vanilla_norm_weights(config)` (model-layers
#       qwen3_attention/init.rs, model-engine model/impl_a1.rs).
#   norm::gated_rms_norm_f32_input_strided: looked up with try_kernel
#       (qwen3_ssm/init.rs); on a zero handle the batched GDN decode keeps the
#       per-sequence norm (trait_decode_multi_seq/ssm_batched_recurrent.rs).






































[shadow_exempt]
w4a16 = ["w4a16_dequant"]
moe_w4a16 = ["moe_w4a16_grouped_gemm"]
norm = [
  "rms_norm_residual_vanilla",
  "residual_add_rms_norm_vanilla",
  "gated_rms_norm_f32_input_strided",
]

# 2026-09-25: File stem → module name overrides. A source not listed here uses

# ------------------------------------------------------------------------------------------------
# Primary component of each entry point (first match wins). `kind` is a short sub-class shown in
# the tables.
# ------------------------------------------------------------------------------------------------

# --- self-contained sets first -------------------------------------------------------------------
[[rule]]
component = "nllb"
kind = "NLLB encoder/decoder op"
names = ["nllb_*"]

[[rule]]
component = "diag"
kind = "microtest / smoke"
names = ["fp4_microtest_*", "noop_smoke", "moe_w4a16_grouped_stream_probe", "lora_bgmv_*_stub", "glm5next_l2pf_spin_ns"]

[[rule]]
component = "vision"
kind = "ViT op"
names = ["vision_*", "vit_*", "glm_vit_*", "conv3d_patch_embed"]

[[rule]]
component = "lora"
kind = "BGMV shrink/expand"
names = ["lora_bgmv_*", "moe_lora_*"]

# --- speculative decoding ---------------------------------------------------------------------------
[[rule]]
component = "spec"
kind = "DFlash drafter"
names = ["dflash2_*"]

# --- attention family -------------------------------------------------------------------------------
[[rule]]
component = "sparse-attn"
kind = "DSA indexer / sparse MLA"
names = ["dsa_*", "glm5next_dsa_*"]

[[rule]]
component = "sparse-attn"
kind = "CSA/HCA compressed attention"
names = ["csa_*", "attn_v41_*", "prefill_attn_compressed"]

[[rule]]
component = "sparse-attn"
kind = "QSA sparse attention"
names = ["qsa_*"]

[[rule]]
component = "mla"
kind = "MLA decode/prefill"
files = ["*mla*"]

[[rule]]
component = "kv-cache"
kind = "cache write"
names = ["reshape_and_cache*", "kv_cache_append*", "fused_k_norm_rope_*cache*", "fill_slots_from_block_table", "bf16_absmax*"]

[[rule]]
component = "kv-cache"
kind = "TurboQuant rotation"
names = ["wht_bf16_*", "tq_plus_innerq_apply_*"]

[[rule]]
component = "attention"
kind = "paged decode"
names = ["paged_decode_attn*", "attention_decode*"]

[[rule]]
component = "attention"
kind = "prefill (flash)"
names = ["attn_prefill*", "attention_prefill", "attention_full"]

[[rule]]
component = "rope"
kind = "rotary"
names = ["rope_*"]

# --- linear attention / SSM -------------------------------------------------------------------------
[[rule]]
component = "short-conv"
kind = "causal conv1d"
names = ["causal_conv1d_*", "k3_kda_conv_*"]

[[rule]]
component = "kda"
kind = "KDA op"
names = ["kda_*", "k3_kda_*"]

[[rule]]
component = "mamba2"
kind = "SSD / selective scan"
names = ["mamba2_*", "selective_scan_*"]

[[rule]]
component = "gdn"
kind = "delta-rule recurrence"
names = ["gated_delta_rule_*", "gdn_*"]

[[rule]]
component = "gdn"
kind = "GDN pre/post-processing"
files = ["*/ssm_preprocess.cu", "*/ssm_state_norm.cu", "*/ssm_h_dtype.cu", "*/ssm_ba_gates_hopper.cu"]

[[rule]]
component = "gdn"
kind = "GDN helper"
names = ["qwen35_qkv_split", "bf16_mul", "sigmoid_bf16_to_f32", "silu_apply"]
files = ["kernels/metal/*"]

# --- MoE ---------------------------------------------------------------------------------------------
[[rule]]
component = "moe"
kind = "routing / top-k"
names = ["moe_topk*", "moe_gate_topk*", "moe_hash_route*", "moe_router_*", "moe_v41_route_*", "moe_v41_router_*", "glm5next_router_topk", "nemotron_moe_topk_*", "dense_gemm_bf16_router"]

[[rule]]
component = "moe"
kind = "dispatch / combine"
names = ["moe_permute_*", "moe_unpermute_*", "moe_sort_*", "moe_count_*", "moe_build_tile_*", "moe_batched_blend", "moe_weighted_sum*", "moe_zero_expert_add", "moe_fp8_grouped_sort", "moe_transpose_*", "moe_v41_*", "glm5next_moe_*", "moe_decode_atomic_c4_finalize", "bucket_builder", "nemotron_moe_weighted_sum_*"]

[[rule]]
component = "moe"
kind = "expert activation"
names = ["moe_silu_mul", "moe_v41_swiglu", "glm5next_swiglu_*"]

[[rule]]
component = "moe"
kind = "expert GEMM/GEMV"
names = ["moe_*", "nemotron_moe_*", "kquant_mmvq_*_experts*", "kquant_mmvq_*_groups_*", "kquant_mmvq_*_pair_*", "pm4_m16", "k3_moe_*"]

# --- hyper-connections, n-gram memory -----------------------------------------------------------
[[rule]]
component = "mhc"
kind = "hyper-connection mix"
names = ["hc_*", "glm5next_hc_*"]

[[rule]]
component = "ngram-mem"
kind = "memory embedding"
names = ["engram_*", "ple_*"]

[[rule]]
component = "quant"
kind = "dequant / repack / transpose"
names = ["w8a16_dequant", "w4a16_dequant"]

# --- projection GEMM/GEMV by format -------------------------------------------------------------------
[[rule]]
component = "gemm-w4a4"
kind = "W4A4 GEMM/GEMV"
